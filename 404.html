<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>BloxShop</title>
<script>
  // GitHub Pages has no real "/main" page — this 404 fallback catches a direct
  // visit or refresh at that URL and quietly sends the browser back to the
  // real app, which will show the login screen again (same as refreshing
  // the main page normally does).
  var base = location.pathname.replace(/\/main\/?$/, "/");
  location.replace(base);
</script>
</head>
<body></body>
</html>
