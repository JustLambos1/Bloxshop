<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloxshop Maintenance</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      padding: 40px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 20px rgba(0,0,0,0.4);

    h1 {
      font-size: 48px;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    h3 {
      font-size: 24px;
      color: #e2e8f0;
      margin-bottom: 10px;
    }

    h5 {
      font-size: 16px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bloxshop Under Maintenance</h1>
    <h3>Please have patience and stay active</h3>

</html>
